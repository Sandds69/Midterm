services:
  db:
    image: postgres:16-alpine
    container_name: hmv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hmv_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hmv_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # SECURITY: the DB port is NOT published to the host. Only the backend can
    # reach it over the private Docker network. Uncomment for local debugging only:
    # ports:
    #   - "127.0.0.1:5433:5432"
    networks:
      - backend

  api:
    build: ./backend
    container_name: hmv-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database host is the "db" service, not localhost.
      DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hmv_db}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    # SECURITY hardening: read-only root FS, no privilege escalation, drop all caps.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: hmv-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:

networks:
  backend:
